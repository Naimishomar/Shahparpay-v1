<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4fbf6"/>
      <stop offset="1" stop-color="#e3f5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#FEF0E4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FEF0E4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="awnGreen" width="40" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="#008c46"/>
      <rect x="20" width="20" height="10" fill="#ffffff"/>
    </pattern>
    <pattern id="awnLime" width="40" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="#F79440"/>
      <rect x="20" width="20" height="10" fill="#ffffff"/>
    </pattern>
    <pattern id="awnTeal" width="40" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="#5eb88a"/>
      <rect x="20" width="20" height="10" fill="#ffffff"/>
    </pattern>
    <pattern id="shutter" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#e2e8f0"/>
      <rect y="6" width="10" height="2" fill="#cbd5e1"/>
    </pattern>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#008c46" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="560" fill="url(#dots)"/>

  <!-- distant skyline -->
  <g fill="#cfeedd" opacity="0.7">
    <rect x="0" y="560" width="120" height="340"/>
    <rect x="130" y="520" width="90" height="380"/>
    <rect x="230" y="585" width="140" height="315"/>
    <rect x="1230" y="575" width="130" height="325"/>
    <rect x="1370" y="530" width="100" height="370"/>
    <rect x="1480" y="565" width="120" height="335"/>
    <rect x="560" y="600" width="480" height="300"/>
  </g>

  <!-- floating service badges -->
  <g opacity="0.9">
    <g transform="translate(150 250)">
      <circle r="38" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
      <text y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#008c46">₹</text>
    </g>
    <g transform="translate(1450 230)">
      <circle r="40" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
      <g fill="none" stroke="#008c46" stroke-width="3" stroke-linecap="round">
        <path d="M-14 10 C-18 -4 -12 -18 0 -18 C12 -18 18 -6 14 8"/>
        <path d="M-7 14 C-11 2 -7 -10 0 -10 C7 -10 10 -2 8 10"/>
        <path d="M0 -2 L0 16"/>
      </g>
    </g>
    <g transform="translate(300 420)">
      <circle r="30" fill="#ffffff" stroke="#FBD5B5" stroke-width="3"/>
      <rect x="-12" y="-17" width="24" height="34" rx="4" fill="none" stroke="#008c46" stroke-width="3"/>
      <circle cy="10" r="2.5" fill="#008c46"/>
    </g>
    <g transform="translate(1300 410)">
      <circle r="30" fill="#ffffff" stroke="#FBD5B5" stroke-width="3"/>
      <path d="M-14 -4 L0 -14 L14 -4 Z M-11 -2 V10 M-4 -2 V10 M4 -2 V10 M11 -2 V10 M-15 13 H15" fill="none" stroke="#008c46" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- street of shops -->
  <g transform="translate(0 700)" opacity="0.8">
    <!-- shop 1 -->
    <g transform="translate(20 0)">
      <rect width="230" height="200" fill="#ffffff" stroke="#d1e7da" stroke-width="2"/>
      <rect x="-8" y="0" width="246" height="34" fill="url(#awnTeal)"/>
      <path d="M-8 34 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 30 0" fill="#5eb88a"/>
      <rect x="25" y="70" width="180" height="130" fill="url(#shutter)"/>
    </g>
    <!-- shop 2 -->
    <g transform="translate(270 -30)">
      <rect width="250" height="230" fill="#ffffff" stroke="#d1e7da" stroke-width="2"/>
      <rect x="-8" y="0" width="266" height="36" fill="url(#awnLime)"/>
      <rect x="20" y="70" width="210" height="80" fill="#f0fdf4" stroke="#d1e7da" stroke-width="2"/>
      <g fill="#bbf7d0"><rect x="35" y="85" width="40" height="50"/><rect x="85" y="85" width="40" height="50"/><rect x="135" y="85" width="40" height="50"/><rect x="185" y="85" width="30" height="50"/></g>
      <rect x="20" y="160" width="210" height="70" fill="#e2e8f0"/>
    </g>

    <!-- centre shop (kept plain so hero text stays readable) -->
    <g transform="translate(550 -30)">
      <rect width="510" height="230" fill="#ffffff" stroke="#d1e7da" stroke-width="2"/>
      <rect x="-8" y="0" width="526" height="36" fill="url(#awnTeal)"/>
      <path d="M-8 36 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0 q16 14 32 0" fill="#5eb88a"/>
      <rect x="30" y="80" width="450" height="150" fill="url(#shutter)"/>
    </g>
    <!-- right: Banking Point shop -->
    <g transform="translate(1090 -90)">
      <rect width="480" height="290" fill="#ffffff" stroke="#9fd8b8" stroke-width="3"/>
      <rect x="40" y="18" width="400" height="54" rx="10" fill="#008c46"/>
      <text x="240" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2">BANKING POINT · CSP</text>
      <rect x="-12" y="86" width="504" height="40" fill="url(#awnGreen)"/>
      <path d="M-12 126 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0 q21 18 42 0" fill="#008c46"/>
      <!-- counter -->
      <rect x="30" y="215" width="420" height="75" fill="#e7f6ee" stroke="#9fd8b8" stroke-width="2"/>
      <!-- fingerprint device -->
      <g transform="translate(110 190)">
        <rect x="-34" y="0" width="68" height="25" rx="7" fill="#1e293b"/>
        <ellipse cx="0" cy="8" rx="15" ry="7" fill="#22c55e"/>
      </g>
      <!-- laptop -->
      <g transform="translate(240 150)">
        <rect x="-60" y="0" width="120" height="62" rx="6" fill="#1e293b"/>
        <rect x="-52" y="7" width="104" height="48" rx="3" fill="#dcfce7"/>
        <rect x="-44" y="15" width="50" height="7" rx="3" fill="#008c46"/>
        <rect x="-44" y="28" width="80" height="5" rx="2" fill="#86efac"/>
        <rect x="-44" y="38" width="64" height="5" rx="2" fill="#86efac"/>
        <rect x="-72" y="62" width="144" height="8" rx="3" fill="#334155"/>
      </g>
      <!-- QR stand -->
      <g transform="translate(370 165)">
        <rect x="-26" y="0" width="52" height="52" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
        <g fill="#1e293b"><rect x="-18" y="8" width="12" height="12"/><rect x="6" y="8" width="12" height="12"/><rect x="-18" y="32" width="12" height="12"/><rect x="6" y="30" width="5" height="5"/><rect x="13" y="37" width="5" height="5"/><rect x="-3" y="22" width="6" height="6"/></g>
        <rect x="-6" y="52" width="12" height="12" fill="#1e293b"/>
      </g>
    </g>

  </g>
</svg>

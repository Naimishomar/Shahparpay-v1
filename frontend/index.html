<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/shahparpay-white-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shahparpay</title>
    <meta name="description" content="Shahparpay turns your shop into a banking point. Offer AEPS, Micro ATM, money transfer, recharge, bill payments and PAN services and earn commission." />
    <link rel="canonical" href="https://www.shahparpay.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shahparpay" />
    <meta property="og:url" content="https://www.shahparpay.in/" />
    <meta property="og:title" content="Shahparpay — Turn Your Shop Into A Banking Point" />
    <meta property="og:description" content="AEPS, Micro ATM, money transfer, recharge, bill payments and PAN services for retailers. Earn commission on every transaction." />
    <meta property="og:image" content="https://www.shahparpay.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["FinancialService", "LocalBusiness"],
        "name": "Shahparpay Solutions Private Limited",
        "alternateName": "Shahparpay",
        "url": "https://www.shahparpay.in/",
        "logo": "https://www.shahparpay.in/og-image.png",
        "image": "https://www.shahparpay.in/og-image.png",
        "description": "B2B fintech platform for retailers offering AEPS, Micro ATM, domestic money transfer, recharge, BBPS bill payments and PAN card services.",
        "telephone": "+91-8240039776",
        "email": "shahparpay@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "4/1 Victoria Lane, Telinipara",
          "addressLocality": "Bhadreswar",
          "addressRegion": "West Bengal",
          "postalCode": "712125",
          "addressCountry": "IN"
        },
        "areaServed": "IN",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Retailer services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AEPS Cash Withdrawal" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AEPS Cash Deposit" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Micro ATM" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Domestic Money Transfer (DMT)" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile & DTH Recharge" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "BBPS Bill Payments" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "PAN Card Services" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

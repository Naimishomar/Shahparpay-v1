services:
  backend-api:
    build: .
    container_name: backend-api
    # .env sets PORT=3000, which is the container-side port below.
    env_file: .env
    ports:
      - '4000:3000'
    restart: unless-stopped
    healthcheck:
      # `/` answers 200 with a plain string; enough to tell a live process from
      # a container that booted and then died on a bad env var.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certs live here. Without a named volume every `docker compose up`
      # throws the cert away and re-requests it, which hits Let's Encrypt rate
      # limits after five deploys in a week.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
